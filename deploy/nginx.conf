# Nginx reverse proxy: public port 80/443 -> Next.js on 127.0.0.1:3000
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/waffle-wizard
#           sudo ln -s /etc/nginx/sites-available/waffle-wizard /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (below) — it rewrites this file to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE-WITH-YOUR-DOMAIN www.REPLACE-WITH-YOUR-DOMAIN;

    # Next.js already compresses HTML; gzip the rest.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    # Immutable build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
