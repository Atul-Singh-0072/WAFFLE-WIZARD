# Waffle Wizard — its OWN nginx server block.
#
# This server already serves HM Agri One from a separate file. Adding this one
# does not touch it: nginx routes by server_name, so each site keeps its own
# config, its own certificate and its own upstream port.
#
# NEVER delete or edit other files in sites-enabled/ while installing this.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/waffle-wizard
#           sudo ln -s /etc/nginx/sites-available/waffle-wizard /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot, which rewrites this file to add HTTPS.

server {
    listen 80;
    listen [::]:80;

    # Must match the domain pointed at this server. Do not add default_server —
    # that would hijack requests meant for the other site.
    server_name REPLACE-WITH-YOUR-DOMAIN www.REPLACE-WITH-YOUR-DOMAIN;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    access_log /var/log/nginx/waffle-wizard.access.log;
    error_log  /var/log/nginx/waffle-wizard.error.log;

    # Immutable build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
